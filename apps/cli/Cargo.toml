[package]
name = "mocky-mail-cli"
version = "0.11.0"
description = "Mocky Mail from the command line, and its MCP server: talks to the running app over its local automation channel."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "mocky-mail"
path = "src/main.rs"

[lib]
name = "mocky_mail_cli"
path = "src/lib.rs"

[dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "io-std", "macros", "time"] }
