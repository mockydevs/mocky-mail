[package]
name = "mocky-mail-desktop"
version = "0.1.0"
description = "Mocky Mail desktop app: Tauri shell around mail-core."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "mocky_mail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
mail-core = { path = "../../../crates/mail-core" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.3"
