[package]
name = "mocky-mail-desktop"
version = "0.10.0"
description = "Mocky Mail desktop app: Tauri shell around mail-app."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "mocky_mail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
android-bridge = { version = "0.1.0", path = "../../../crates/android-bridge" }
async-trait = "0.1.92"
mail-app = { version = "0.1.0", path = "../../../crates/mail-app" }
mail-core = { path = "../../../crates/mail-core" }
mail-store = { version = "0.1.0", path = "../../../crates/mail-store" }
mail-sync = { version = "0.1.0", path = "../../../crates/mail-sync" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tokio = { version = "1.54.1", features = ["time"] }

# Desktop only: one running copy at a time. Android runs one copy anyway.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
# A message box when the app can't start (already used by the dialog plugin).
rfd = { version = "0.17", default-features = false, features = ["common-controls-v6"] }

# Windows only: notifications from the Microsoft Store (MSIX) package must use
# the package's own app id, which the notification plugin can't do.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["ApplicationModel"] }
tauri-winrt-notification = "0.8.1"
