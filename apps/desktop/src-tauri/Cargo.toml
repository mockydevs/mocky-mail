[package]
name = "mocky-mail-desktop"
version = "0.1.0"
description = "Mocky Mail desktop app: Tauri shell around mail-core."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[lib]
name = "mocky_mail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
futures = "0.3.34"
mail-auth = { version = "0.1.0", path = "../../../crates/mail-auth" }
mail-core = { path = "../../../crates/mail-core" }
mail-store = { version = "0.1.0", path = "../../../crates/mail-store" }
mail-sync = { version = "0.1.0", path = "../../../crates/mail-sync" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["sync", "time", "macros", "fs"] }

# Windows only: notifications from the Microsoft Store (MSIX) package must use
# the package's own app id, which the notification plugin can't do.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["ApplicationModel"] }
tauri-winrt-notification = "0.8.1"
