name: Release

# Builds the installers for every platform and attaches them to a draft
# GitHub release. Push a tag that matches the app version (for example
# v0.1.0), check the draft, then publish it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match app version $version in tauri.conf.json" >&2
            exit 1
          fi
      - name: Create the draft (or reuse it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --verify-tag --title "Mocky Mail ${TAG#v}" \
              --notes "Installers for Windows, macOS and Linux. See docs/install.md for how to install."

  build:
    name: Installers (${{ matrix.name }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the .deb runs on 22.04 and newer.
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb
            out: target/release/bundle/deb/*.deb
          - name: Windows
            os: windows-latest
            args: --bundles msi,nsis
            out: target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            args: --bundles dmg --target universal-apple-darwin
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Build installers
        working-directory: apps/desktop
        shell: bash
        env:
          # Gmail and Outlook sign-in registrations, compiled into the app.
          MOCKY_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.MOCKY_MAIL_GOOGLE_CLIENT_ID }}
          MOCKY_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MOCKY_MAIL_GOOGLE_CLIENT_SECRET }}
          MOCKY_MAIL_MS_CLIENT_ID: ${{ secrets.MOCKY_MAIL_MS_CLIENT_ID }}
        run: npx --yes @tauri-apps/cli@2.12.4 build ${{ matrix.args }}
      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.out }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found for ${{ matrix.name }}" >&2
            exit 1
          fi
          # Spaces in "Mocky Mail" make awkward download names; use mocky-mail instead.
          for f in "${files[@]}"; do
            name=$(basename "$f")
            clean="${name// /-}"
            clean="${clean/Mocky-Mail/mocky-mail}"
            [ "$name" = "$clean" ] || cp "$f" "$clean"
            gh release upload "$TAG" "$clean" --clobber
          done
