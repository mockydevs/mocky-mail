name: Release

# Builds the installers for every platform and attaches them to a draft
# GitHub release. Push a tag that matches the app version (for example
# v0.1.0), check the draft, then publish it.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
      android_only:
        description: Build only the Android bundle (leave the published installers alone)
        type: boolean
        default: false
      android_ref:
        description: Build the Android bundle from this branch or commit instead of the tag (only for build fixes; the app version must match the tag)
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  draft:
    name: Create draft release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match app version $version in tauri.conf.json" >&2
            exit 1
          fi
      - name: Create the draft (or reuse it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --verify-tag --title "Mocky Mail ${TAG#v}" \
              --notes "Installers for Windows, macOS and Linux. See docs/install.md for how to install."

  build:
    name: Installers (${{ matrix.name }})
    needs: draft
    if: ${{ !inputs.android_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the .deb runs on 22.04 and newer.
          - name: Linux
            os: ubuntu-22.04
            cli: x86_64-unknown-linux-gnu
            args: --bundles deb,rpm,appimage
            out: target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage
          - name: Linux ARM64
            os: ubuntu-22.04-arm
            cli: aarch64-unknown-linux-gnu
            args: --bundles deb,rpm,appimage
            out: target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage
          - name: Windows
            os: windows-latest
            cli: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
            out: target/release/bundle/msi/*.msi target/release/bundle/nsis/*.exe
          - name: Windows ARM64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            cli: aarch64-pc-windows-msvc
            args: --bundles msi,nsis --target aarch64-pc-windows-msvc
            out: target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
          - name: macOS
            os: macos-latest
            cli: universal-apple-darwin
            args: --bundles dmg --target universal-apple-darwin
            out: target/universal-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # file and libfuse2: the AppImage bundler (linuxdeploy) needs both.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf file libfuse2
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      # The mocky-mail command line (and MCP server), bundled with the
      # installers as a Tauri sidecar next to the app's own program.
      - name: Build the command line
        shell: bash
        run: bash scripts/build-cli.sh ${{ matrix.cli }}
      - name: Build installers
        working-directory: apps/desktop
        shell: bash
        env:
          # Gmail and Outlook sign-in registrations, compiled into the app.
          MOCKY_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.MOCKY_MAIL_GOOGLE_CLIENT_ID }}
          MOCKY_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MOCKY_MAIL_GOOGLE_CLIENT_SECRET }}
          MOCKY_MAIL_MS_CLIENT_ID: ${{ secrets.MOCKY_MAIL_MS_CLIENT_ID }}
        run: npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.cli.conf.json ${{ matrix.args }}
      - name: Attach to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(${{ matrix.out }})
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found for ${{ matrix.name }}" >&2
            exit 1
          fi
          # Spaces in "Mocky Mail" make awkward download names; use mocky-mail instead.
          for f in "${files[@]}"; do
            name=$(basename "$f")
            clean="${name// /-}"
            clean="${clean/Mocky-Mail/mocky-mail}"
            [ "$name" = "$clean" ] || cp "$f" "$clean"
            gh release upload "$TAG" "$clean" --clobber
          done

  android:
    name: Android app bundle
    needs: draft
    runs-on: ubuntu-24.04
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.android_ref || env.TAG }}
      - name: Check the app version matches the tag
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          [ "$TAG" = "v$version" ] || { echo "App version $version does not match $TAG" >&2; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Gradle downloads (Kotlin, Android Gradle plugin…) kept between runs:
          # fewer requests to Maven Central, which rate-limits busy runners.
          cache: gradle
          cache-dependency-path: |
            apps/desktop/src-tauri/gen/android/**/*.gradle*
            apps/desktop/src-tauri/gen/android/**/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Set up the Play upload key
        working-directory: apps/desktop/src-tauri/gen/android
        env:
          ANDROID_UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_UPLOAD_KEYSTORE" ]; then
            echo "The ANDROID_UPLOAD_KEYSTORE secret is not set" >&2
            exit 1
          fi
          echo "$ANDROID_UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "password=$ANDROID_UPLOAD_KEY_PASSWORD"
            echo "keyAlias=upload"
            echo "storeFile=$RUNNER_TEMP/upload.jks"
          } > keystore.properties
      - name: Build the app bundle
        working-directory: apps/desktop
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
          MOCKY_MAIL_GOOGLE_CLIENT_ID: ${{ secrets.MOCKY_MAIL_GOOGLE_CLIENT_ID }}
          MOCKY_MAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.MOCKY_MAIL_GOOGLE_CLIENT_SECRET }}
          MOCKY_MAIL_MS_CLIENT_ID: ${{ secrets.MOCKY_MAIL_MS_CLIENT_ID }}
        run: |
          export NDK_HOME="${NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          npx --yes @tauri-apps/cli@2.12.4 android build --aab --ci
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name '*.aab' | head -n 1)
          [ -n "$aab" ] || { echo "No .aab was built" >&2; exit 1; }
          cp "$aab" "$RUNNER_TEMP/mocky-mail_${TAG#v}.aab"
          echo "AAB=$RUNNER_TEMP/mocky-mail_${TAG#v}.aab" >> "$GITHUB_ENV"
      - name: Keep the bundle with this run
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: ${{ env.AAB }}
          retention-days: 30
      # Sends the bundle to Play's production track and submits it for review;
      # it goes live once Google approves it. Skipped without the
      # PLAY_SERVICE_ACCOUNT_JSON secret.
      - name: Send to Google Play
        if: env.PLAY_SERVICE_ACCOUNT_JSON != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ke.co.mocky.mail
          releaseFiles: ${{ env.AAB }}
          track: production
          status: completed
          releaseName: ${{ env.TAG }}
