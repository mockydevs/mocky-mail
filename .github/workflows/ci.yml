name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  engine:
    name: Mail engine (fmt, clippy, tests, audit)
    runs-on: ubuntu-24.04
    services:
      greenmail:
        image: greenmail/standalone:2.1.3
        ports:
          - 3025:3025
          - 3143:3143
        env:
          GREENMAIL_OPTS: -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=alice:secret@local.test,bob:secret@local.test -Dgreenmail.users.login=email
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p mail-core -p mail-sync -p mail-store -p mail-app -p mocky-mail-cli --all-targets
      - run: cargo test -p mail-core -p mail-sync -p mail-store -p mail-app -p mocky-mail-cli
      - name: IMAP and SMTP against a disposable test server
        run: cargo test -p mail-sync --features insecure-plaintext --test live_server
        env:
          MOCKY_TEST_SERVER: 127.0.0.1
      - name: Audit dependencies for known vulnerabilities
        run: cargo install cargo-audit --locked && cargo audit

  interface:
    name: Interface (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  app:
    name: Desktop app (${{ matrix.os }})
    needs: [engine, interface]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      # One cache per image: Ubuntu 22.04 and 24.04 would otherwise share
      # one, and build scripts and proc-macros compiled against 24.04's
      # newer glibc then fail to load on 22.04.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Build the command line (the installers' sidecar)
        shell: bash
        run: bash scripts/build-cli.sh host
      - name: Build installers
        working-directory: apps/desktop
        run: npx --yes @tauri-apps/cli@2.12.4 build --config src-tauri/tauri.cli.conf.json

  # Builds the Android app (one processor type, unsigned) so Kotlin and
  # Android-only Rust code are compiled before a release, not first by it.
  android:
    name: Android app (build check)
    needs: [engine, interface]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          # Gradle downloads (Kotlin, Android Gradle plugin…) kept between runs:
          # fewer requests to Maven Central, which rate-limits busy runners.
          cache: gradle
          cache-dependency-path: |
            apps/desktop/src-tauri/gen/android/**/*.gradle*
            apps/desktop/src-tauri/gen/android/**/gradle-wrapper.properties
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ci
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/desktop
      - name: Build the app bundle
        working-directory: apps/desktop
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx --yes @tauri-apps/cli@2.12.4 android build --aab --ci --target aarch64
