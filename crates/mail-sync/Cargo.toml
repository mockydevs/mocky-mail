[package]
name = "mail-sync"
version = "0.1.0"
description = "Mocky Mail network layer: IMAP sync, SMTP sending, message building and keyring secrets."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
futures = "0.3.34"
getrandom = "0.4.3"
keyring = "4.2.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring"] }
mail-core = { version = "0.1.0", path = "../mail-core" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = "0.7.20"

[features]
# Allows unencrypted connections. Only for integration tests against a
# local test server; never enabled by the app.
insecure-plaintext = []

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.154"
