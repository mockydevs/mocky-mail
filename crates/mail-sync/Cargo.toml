[package]
name = "mail-sync"
version = "0.1.0"
description = "Mocky Mail network layer: IMAP sync, SMTP sending, message building and keyring secrets."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
futures = "0.3.34"
getrandom = "0.4.3"
hickory-resolver = "0.26.3"
keyring-core = "1.0.1"
mail-core = { version = "0.1.0", path = "../mail-core" }
quick-xml = "0.42.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = { version = "0.6.5", features = ["all"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-util = "0.7.20"

# Security (0.10.0): S/MIME and OpenPGP. All pure Rust, MIT OR Apache-2.0.
# The RustCrypto crates are the generation rPGP 0.21 uses (digest 0.10,
# der 0.7), so there is one copy of each in the app.
# OpenPGP signatures checked and keys read (PGP/MIME, inline, Autocrypt):
# MailCraft's hardened wrapper around rPGP.
mailcraft-openpgp = { git = "https://github.com/UCSLabs/mailcraft", rev = "61e9f46f069a3f0cf016283d7c329c07bd60c7cc" }
# rPGP itself, for signing, encrypting, decrypting and secret keys. Pinned
# to the version mailcraft-openpgp is built against.
pgp = { version = "=0.21.1", default-features = false }
# S/MIME: CMS (RFC 5652), X.509 (RFC 5280), PKCS #12, and the algorithms.
cms = { version = "0.2.3", features = ["alloc", "std"] }
x509-cert = { version = "0.2.5", features = ["pem", "std"] }
der = { version = "0.7.10", features = ["alloc", "oid", "pem", "derive", "std"] }
spki = { version = "0.7.3", features = ["alloc"] }
const-oid = { version = "0.9.6", features = ["db"] }
rsa = { version = "0.9.10", default-features = false, features = ["std", "pem", "u64_digit", "sha2"] }
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.13.1", features = ["ecdsa", "pkcs8", "pem"] }
signature = "2.2.0"
sha1 = "0.10.6"
sha2 = { version = "0.10.9", features = ["oid"] }
aes = "0.8.4"
cbc = { version = "0.1.2", features = ["alloc", "block-padding"] }
aes-gcm = "0.10.3"
des = "0.8.1"
rc2 = "0.8.1"
pkcs1 = "0.7.5"
pkcs5 = { version = "0.7.1", features = ["pbes2", "3des", "sha1-insecure", "alloc"] }
pkcs8 = { version = "0.10.2", features = ["alloc", "pem", "encryption"] }
pkcs12 = { version = "0.1.0", features = ["kdf"] }
hmac = "0.12.1"
# Exchange Server sign-in (NTLMv2): MD4 of the password, then HMAC-MD5.
# RustCrypto, MIT OR Apache-2.0.
md4 = "0.10.2"
md-5 = "0.10.6"
rand_core = { version = "0.6.4", features = ["getrandom"] }
zeroize = "1.9.1"

# The desktop keyrings (Secret Service, Credential Manager, Keychain).
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = "4.2.0"
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-platform-verifier", "ring"] }

# Android: secrets encrypted with a key held in the Android Keystore.
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
# lettre's platform-verifier path doesn't build on Android (it needs an API
# that only exists on desktop), so sending checks certificates against
# Mozilla's root list there. IMAP still uses Android's own trust store.
lettre = { version = "0.11.24", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "webpki-roots", "ring"] }

# The trusted roots S/MIME signers are checked against (Windows reads its
# own store, with the uses it allows each root; Android reads its folders).
[target.'cfg(not(any(windows, target_os = "android")))'.dependencies]
rustls-native-certs = "0.8.5"

[target.'cfg(windows)'.dependencies]
schannel = "0.1.30"

[features]
# Allows unencrypted connections. Only for integration tests against a
# local test server; never enabled by the app.
insecure-plaintext = []

[lints]
workspace = true

[dev-dependencies]
# Test certificates made at test time (authorities, signers).
rcgen = "0.14.10"
