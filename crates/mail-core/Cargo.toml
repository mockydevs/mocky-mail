[package]
name = "mail-core"
version = "0.1.0"
description = "Pure, I/O-free mail logic for Mocky Mail: parsing, sanitizing, outbox rules and size limits."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ammonia = "4.2.5"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
mail-parser = "0.11.9"
markdown = "1.0"
rrule = "0.14"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
serde_json = "1.0.154"
