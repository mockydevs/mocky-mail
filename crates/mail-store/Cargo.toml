[package]
name = "mail-store"
version = "0.1.0"
description = "Local SQLite database for Mocky Mail: accounts, folders, messages, search, outbox and offline actions."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
getrandom = "0.4.3"
mail-core = { version = "0.1.0", path = "../mail-core" }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
